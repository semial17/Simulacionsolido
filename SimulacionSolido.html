<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sólido de Revolución: Capas Cilíndricas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        #canvas-container { flex: 1; height: 100%; position: relative; z-index: 0; }
        
        /* Scrollbar personalizado para el panel UI */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(51, 65, 85, 0.5);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        /* Estilos de slider (Rango) */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 6px; cursor: pointer;
            background: #334155; border-radius: 4px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 16px; width: 16px; border-radius: 50%;
            background: #3b82f6; cursor: pointer;
            -webkit-appearance: none; margin-top: -5px;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
    </style>

    <!-- Import Map para cargar Three.js como módulos ES -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body class="antialiased flex h-screen w-screen overflow-hidden">

    <!-- Panel Lateral UI -->
    <div class="w-80 lg:w-96 glass-panel flex-shrink-0 flex flex-col h-full overflow-y-auto border-r border-slate-700 shadow-[10px_0_20px_rgba(0,0,0,0.5)] z-10">
        
        <!-- Header -->
        <div class="p-5 border-b border-slate-700">
            <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-cyan-300 bg-clip-text text-transparent">
                Sólido de Revolución
            </h1>
            <p class="text-sm text-slate-400 mt-1">Método de Capas Cilíndricas</p>
        </div>

        <!-- Funciones Matemáticas -->
        <div class="p-5 space-y-4">
            <div>
                <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-2">Funciones Base</h2>
                <div class="bg-slate-800 rounded-lg p-3 text-sm font-mono space-y-2 border border-slate-700">
                    <p><span class="text-blue-400">f(x)</span> = -x² + 4x <span class="text-slate-500 text-xs ml-2">(Superior)</span></p>
                    <p><span class="text-emerald-400">g(x)</span> = x <span class="text-slate-500 text-xs ml-2">(Inferior)</span></p>
                    <p class="text-slate-400 border-t border-slate-700 pt-2 mt-2">Intervalo: x ∈ [0, 3]</p>
                    <p class="text-slate-400">Eje de Rotación: Eje Y (x=0)</p>
                </div>
            </div>

            <!-- Controles: Ángulo de Rotación -->
            <div>
                <div class="flex justify-between mb-1">
                    <label for="angleSlider" class="text-sm font-medium text-slate-200">Ángulo de Rotación (θ)</label>
                    <span id="angleLabel" class="text-sm font-bold text-blue-400">0°</span>
                </div>
                <input type="range" id="angleSlider" min="0" max="360" value="0" class="mt-2">
                <div class="flex justify-between items-center mt-3">
                    <p class="text-xs text-slate-500">Genera la superficie 3D en tiempo real.</p>
                    <button id="btnAnimate" class="flex items-center gap-1 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-1.5 px-3 rounded transition shadow-lg cursor-pointer">
                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" fill-rule="evenodd"></path></svg> Animar
                    </button>
                </div>
            </div>

            <!-- Controles: Capa Cilíndrica -->
            <div class="pt-4 border-t border-slate-700">
                <div class="flex justify-between mb-1">
                    <label for="shellSlider" class="text-sm font-medium text-slate-200">Posición de Capa (x)</label>
                    <span id="shellLabel" class="text-sm font-bold text-yellow-400">1.50</span>
                </div>
                <input type="range" id="shellSlider" min="0.01" max="2.99" step="0.01" value="1.50" class="mt-2" style="--tw-thumb-color: #facc15;">
                
                <!-- Datos de la Capa Seleccionada -->
                <div class="bg-slate-800 rounded-lg p-3 text-sm font-mono space-y-1 border border-slate-700 mt-3">
                    <p class="text-slate-300">
                        Radio <span class="text-slate-500 text-xs">r(x) = x =</span> 
                        <span id="calcR" class="text-yellow-400 font-bold">1.50</span>
                    </p>
                    <p class="text-slate-300">
                        Altura <span class="text-slate-500 text-xs">h(x) = 3x - x² =</span> 
                        <span id="calcH" class="text-yellow-400 font-bold">2.25</span>
                    </p>
                </div>
            </div>
            
            <!-- Visibilidad Extra -->
            <div class="pt-4 border-t border-slate-700 space-y-2">
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" id="toggle2D" checked class="rounded border-slate-600 bg-slate-700 text-blue-500 focus:ring-blue-500">
                    <span class="text-sm text-slate-300">Mostrar Región 2D de Referencia</span>
                </label>
            </div>
        </div>
    </div>

    <!-- Contenedor WebGL -->
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Variables Globales de Escena
        let scene, camera, renderer, controls;
        
        // Grupos de Mallas
        let latheGroup = new THREE.Group();
        let shellGroup = new THREE.Group();
        let graph2DGroup = new THREE.Group();
        
        // Elementos del UI
        const angleSlider = document.getElementById('angleSlider');
        const angleLabel = document.getElementById('angleLabel');
        const btnAnimate = document.getElementById('btnAnimate');
        const shellSlider = document.getElementById('shellSlider');
        const shellLabel = document.getElementById('shellLabel');
        const calcR = document.getElementById('calcR');
        const calcH = document.getElementById('calcH');
        const toggle2D = document.getElementById('toggle2D');

        // Funciones Matemáticas Base
        function f(x) { return -Math.pow(x, 2) + 4 * x; }
        function g(x) { return x; }

        // Parámetros de Resolución
        const RESOLUTION_X = 64; // Segmentos en x para curvas
        const RESOLUTION_THETA = 100; // Segmentos radiales para revolución

        // Variables de Animación
        let isAnimating = false;
        let animSpeed = 1.5; // Grados por frame

        init();
        animate();

        function init() {
            // 1. Escena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a); // Fondo oscuro Tailwind

            // 2. Cámara
            const container = document.getElementById('canvas-container');
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
            // Alejar la cámara incrementando sus valores en X, Y y Z
            camera.position.set(9, 7, 11);

            // 3. Renderizador WebGL
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 4. Controles (OrbitControls)
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            // Elevar un poco el objetivo para centrar el sólido verticalmente
            controls.target.set(1.5, 2, 0); 

            // 5. Iluminación
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 10, 10);
            scene.add(dirLight);
            
            const dirLight2 = new THREE.DirectionalLight(0xffaaff, 0.3);
            dirLight2.position.set(-10, -5, -10);
            scene.add(dirLight2);

            // 6. Ejes de Coordenadas (X=Rojo, Y=Verde, Z=Azul)
            const axesHelper = new THREE.AxesHelper(4);
            scene.add(axesHelper);

            // Cuadrícula en Y=0
            const gridHelper = new THREE.GridHelper(10, 10, 0x334155, 0x1e293b);
            scene.add(gridHelper);

            // Inicializar Estructuras
            scene.add(latheGroup);
            scene.add(shellGroup);
            scene.add(graph2DGroup);

            // Construir Región 2D inicial y primer estado de la Shell
            build2DGraph();
            updateRevolution(0);
            updateShell(parseFloat(shellSlider.value));

            // Manejar redimensionamiento
            window.addEventListener('resize', onWindowResize);

            // Configurar Eventos del UI
            setupEventListeners();
        }

        function updateRevolution(theta) {
            // Limpiar geometrías previas para optimizar memoria
            latheGroup.children.forEach(child => {
                if(child.geometry) child.geometry.dispose();
                if(child.material) child.material.dispose();
            });
            latheGroup.clear();

            if (theta <= 0) return;

            // Arrays de puntos bidimensionales (Radio=X, Altura=Y)
            const ptsF = [];
            const ptsG = [];

            for (let i = 0; i <= RESOLUTION_X; i++) {
                let x = (i / RESOLUTION_X) * 3; 
                // Para Three.js LatheGeometry: x corresponde al radio, y a la altura
                ptsF.push(new THREE.Vector2(x, f(x)));
                ptsG.push(new THREE.Vector2(x, g(x)));
            }

            // Material para la superficie generada
            const materialSuperficie = new THREE.MeshPhysicalMaterial({
                color: 0x3b82f6, // Tailwind Blue 500
                metalness: 0.2,
                roughness: 0.4,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.95
            });

            // Generar Superficie Superior (f(x)) e Inferior (g(x)) rotadas hasta θ
            const geoF = new THREE.LatheGeometry(ptsF, RESOLUTION_THETA, 0, theta);
            const geoG = new THREE.LatheGeometry(ptsG, RESOLUTION_THETA, 0, theta);

            latheGroup.add(new THREE.Mesh(geoF, materialSuperficie));
            latheGroup.add(new THREE.Mesh(geoG, materialSuperficie));

            // --- Generar "Tapas" Planas Transversales (Las caras 2D al inicio y al final de la rotación) ---
            const capShape = new THREE.Shape();
            capShape.moveTo(0, f(0)); // Inicia en origen
            
            // Borde superior
            for (let i = 1; i <= RESOLUTION_X; i++) {
                let x = (i / RESOLUTION_X) * 3;
                capShape.lineTo(x, f(x));
            }
            // Borde inferior (regreso al origen)
            for (let i = RESOLUTION_X; i >= 0; i--) {
                let x = (i / RESOLUTION_X) * 3;
                capShape.lineTo(x, g(x));
            }

            const capGeo = new THREE.ShapeGeometry(capShape);
            const capMaterial = new THREE.MeshStandardMaterial({
                color: 0x2563eb, // Color ligeramente más oscuro para diferenciar
                side: THREE.DoubleSide
            });

            // Tapa estática en θ = 0
            const startCap = new THREE.Mesh(capGeo, capMaterial);
            latheGroup.add(startCap);

            // Tapa dinámica en θ actual (sólo si no se ha completado el círculo)
            if (theta < Math.PI * 2 - 0.01) {
                const endCap = new THREE.Mesh(capGeo, capMaterial);
                // Three.js Lathe rota mapeando X-> -Z. Asignar rotación y a theta lo iguala.
                endCap.rotation.y = theta; 
                latheGroup.add(endCap);
            }
        }

        function updateShell(x_val) {
            shellGroup.children.forEach(child => {
                if(child.geometry) child.geometry.dispose();
                if(child.material) child.material.dispose();
            });
            shellGroup.clear();

            if (x_val <= 0.05 || x_val >= 2.95) return; // Evitar renderizar tapas nulas en los extremos

            let altura = f(x_val) - g(x_val);
            if (altura <= 0) return;

            const thickness = 0.06; // Grosor representativo del diferencial (dx)
            const r_in = Math.max(0.001, x_val - thickness / 2);
            const r_out = x_val + thickness / 2;

            // Creamos un anillo en 2D que será extruido a lo largo del eje Z original
            const shape = new THREE.Shape();
            shape.absarc(0, 0, r_out, 0, Math.PI * 2, false);
            
            const hole = new THREE.Path();
            hole.absarc(0, 0, r_in, 0, Math.PI * 2, true);
            shape.holes.push(hole);

            const extrudeSettings = { 
                depth: altura, 
                bevelEnabled: false, 
                curveSegments: 64 
            };
            
            const shellGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            
            // Ajustar la orientación geométrica: ExtrudeGeometry crece hacia +Z. 
            // Rotando X por -90°, crece hacia +Y, encajando con nuestro sistema de ejes.
            shellGeo.rotateX(-Math.PI / 2);
            
            // Desplazar en Y desde 0 hasta su base correcta, g(x)
            shellGeo.translate(0, g(x_val), 0);

            const shellMaterial = new THREE.MeshPhysicalMaterial({
                color: 0xfacc15, // Yellow-400
                transparent: true,
                opacity: 0.65,
                side: THREE.DoubleSide,
                depthWrite: false, // Fundamental para evitar glitchings de opacidad con geometrías internas
                metalness: 0.1,
                roughness: 0.2
            });

            const shellMesh = new THREE.Mesh(shellGeo, shellMaterial);
            shellGroup.add(shellMesh);
        }

        function build2DGraph() {
            graph2DGroup.clear();

            // Materiales para las líneas de la gráfica
            const matF = new THREE.LineBasicMaterial({ color: 0x60a5fa, linewidth: 3 }); // Azul claro
            const matG = new THREE.LineBasicMaterial({ color: 0x34d399, linewidth: 3 }); // Verde esmeralda

            const ptsF = [];
            const ptsG = [];
            
            // Forma para el área rellena
            const shape = new THREE.Shape();
            shape.moveTo(0, f(0));

            for (let i = 0; i <= RESOLUTION_X; i++) {
                let x = (i / RESOLUTION_X) * 3;
                ptsF.push(new THREE.Vector3(x, f(x), 0));
                ptsG.push(new THREE.Vector3(x, g(x), 0));
                
                // Trazar borde superior para el relleno
                if(i > 0) shape.lineTo(x, f(x));
            }
            
            // Trazar borde inferior de regreso para el relleno
            for (let i = RESOLUTION_X; i >= 0; i--) {
                let x = (i / RESOLUTION_X) * 3;
                shape.lineTo(x, g(x));
            }

            const geoF = new THREE.BufferGeometry().setFromPoints(ptsF);
            const geoG = new THREE.BufferGeometry().setFromPoints(ptsG);

            graph2DGroup.add(new THREE.Line(geoF, matF));
            graph2DGroup.add(new THREE.Line(geoG, matG));
            
            // Añadir el Área Rellena Translúcida
            const shapeGeo = new THREE.ShapeGeometry(shape);
            const shapeMat = new THREE.MeshBasicMaterial({ 
                color: 0x3b82f6, 
                transparent: true, 
                opacity: 0.2,
                side: THREE.DoubleSide
            });
            graph2DGroup.add(new THREE.Mesh(shapeGeo, shapeMat));
        }

        function setupEventListeners() {
            angleSlider.addEventListener('input', (e) => {
                isAnimating = false; // Detener animación si el usuario interactúa
                btnAnimate.innerHTML = '<svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" fill-rule="evenodd"></path></svg> Animar';
                
                const deg = parseFloat(e.target.value);
                angleLabel.innerText = deg + '°';
                const theta = (deg * Math.PI) / 180;
                updateRevolution(theta);
            });

            btnAnimate.addEventListener('click', () => {
                isAnimating = !isAnimating;
                if(isAnimating) {
                    btnAnimate.innerHTML = '<svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg> Pausa';
                    if (parseFloat(angleSlider.value) >= 360) {
                        angleSlider.value = 0; // Reiniciar si está al final
                    }
                } else {
                    btnAnimate.innerHTML = '<svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" fill-rule="evenodd"></path></svg> Animar';
                }
            });

            shellSlider.addEventListener('input', (e) => {
                const x_val = parseFloat(e.target.value);
                shellLabel.innerText = x_val.toFixed(2);
                
                // Actualizar Textos
                calcR.innerText = x_val.toFixed(2);
                const h = 3 * x_val - Math.pow(x_val, 2);
                calcH.innerText = h.toFixed(2);

                updateShell(x_val);
            });

            toggle2D.addEventListener('change', (e) => {
                graph2DGroup.visible = e.target.checked;
            });
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // Lógica de animación automática
            if (isAnimating) {
                let currentDeg = parseFloat(angleSlider.value);
                currentDeg += animSpeed;
                
                if (currentDeg >= 360) {
                    currentDeg = 360;
                    isAnimating = false; // Detener al completar
                    btnAnimate.innerHTML = '<svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" fill-rule="evenodd"></path></svg> Animar';
                }
                
                angleSlider.value = currentDeg;
                angleLabel.innerText = Math.round(currentDeg) + '°';
                updateRevolution((currentDeg * Math.PI) / 180);
            }

            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
